name: serverdr
description: >
  ServerDr — mobile server administration, monitoring and security tool.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  go_router: ^14.2.0
  provider: ^6.1.2
  dartssh2: ^2.12.0
  xterm: ^4.0.0
  flutter_secure_storage: 11.1.0
  file_picker: ^12.2.0
  shared_preferences: ^2.3.2
  webview_flutter: ^4.10.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Generates real Android/iOS launcher icons from the ServerDr mark
  # (assets/icon/icon.png, assets/icon/icon_foreground.png) instead of
  # the default Flutter icon. Run after `flutter pub get`:
  #   dart run flutter_launcher_icons
  # Rewrites files under android/app/src/main/res/mipmap-*/ and
  # ios/Runner/Assets.xcassets/ — safe to re-run any time the source
  # images change.
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  # fonts: intentionally omitted — see project README for why and how to add them.

  assets:
    - assets/icon/icon.png
    - assets/icon/icon_foreground.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B141C"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
