name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Never paste passwords, private keys or full server IPs you want to keep private.**
        For security vulnerabilities, don't use this form. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Files
        2. Tap Connect
        3. ...
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: ServerDr version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "e.g. Pixel 7, Android 14"
    validations:
      required: true
  - type: input
    id: server-os
    attributes:
      label: Server OS and SSH server (if relevant)
      placeholder: "e.g. Ubuntu 22.04, OpenSSH 8.9"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Connections
        - Files / SFTP
        - Editor
        - Terminal
        - Command palette
        - Web
        - Health / Monitoring
        - Security
        - Transfers
        - Settings
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message or logs
      description: Redact any secrets before pasting.
      render: shell